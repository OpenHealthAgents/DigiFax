[project]
name = "medingest-api"
version = "0.1.0"
description = "MedIngest API Backend Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.3",
    "sqlalchemy>=2.0.31",
    "psycopg2-binary>=2.9.9",
    "celery>=5.4.0",
    "redis>=5.0.6",
    "requests>=2.32.3",
    "pypdfium2>=4.28.0",
    "pillow>=10.3.0",
    "python-multipart>=0.0.9",
    "cryptography>=49.0.0",
    "pyjwt>=2.8.0",
    "boto3>=1.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "ruff>=0.4.9",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "PL"]
ignore = ["E501", "PLR0913", "PLR0917", "PLR2004", "PLC0415", "E402"]  # Line too long, arg limits, magic values, dynamic imports, and late imports

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
