replicaCount: 2

image:
  repository: digifax-api
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1024Mi

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

config:
  minioEndpoint: "minio-service:9000"
  natsUrl: "nats://nats-service:4222"
  temporalUrl: "temporal-service:7233"

