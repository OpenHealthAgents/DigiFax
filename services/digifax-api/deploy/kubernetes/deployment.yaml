apiVersion: apps/v1
kind: Deployment
metadata:
  name: digifax-api
  namespace: default
  labels:
    app: digifax-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: digifax-api
  template:
    metadata:
      labels:
        app: digifax-api
    spec:
      containers:
        - name: digifax-api
          image: digifax-api:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1024Mi
          envFrom:
            - configMapRef:
                name: digifax-config
            - secretRef:
                name: digifax-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15

---

apiVersion: v1
kind: Service
metadata:
  name: digifax-api-service
  namespace: default
spec:
  selector:
    app: digifax-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: digifax-worker
  namespace: default
  labels:
    app: digifax-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: digifax-worker
  template:
    metadata:
      labels:
        app: digifax-worker
    spec:
      containers:
        - name: digifax-worker
          image: digifax-api:latest
          command: ["python", "src/infrastructure/workflows/temporal_worker.py"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1024Mi
          envFrom:
            - configMapRef:
                name: digifax-config
            - secretRef:
                name: digifax-secrets
